<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de taille MP3</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn {
            border: 2px solid #3498db;
            color: white;
            background-color: #3498db;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }
        .result-box {
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .total-size {
            font-size: 36px;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }
        .details {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculateur de taille des MP3</h1>
    <p>Sélectionnez le dossier contenant vos fichiers audios (ou sélectionnez plusieurs fichiers directement) pour calculer leur poids total en Gigaoctets (Go).</p>
    
    <div class="upload-btn-wrapper">
        <button class="btn">Sélectionner un dossier ou des fichiers</button>
        <!-- webkitdirectory permet de sélectionner un dossier complet -->
        <input type="file" id="fileInput" multiple webkitdirectory directory />
    </div>

    <div class="result-box">
        <div class="details" id="detailsText">En attente de fichiers...</div>
        <div class="total-size" id="resultText">0.000 Go</div>
    </div>
</div>

<script>
    document.getElementById('fileInput').addEventListener('change', function(event) {
        const files = event.target.files;
        let totalBytes = 0;
        let mp3Count = 0;

        // Parcourir tous les fichiers sélectionnés
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            
            // Vérifier si le fichier est un mp3 (par extension ou type MIME)
            if (file.name.toLowerCase().endsWith('.mp3') || file.type === 'audio/mpeg' || file.type === 'audio/mp3') {
                totalBytes += file.size;
                mp3Count++;
            }
        }

        if (mp3Count === 0) {
            document.getElementById('detailsText').innerText = "Aucun fichier MP3 trouvé dans la sélection.";
            document.getElementById('resultText').innerText = "0.000 Go";
            return;
        }

        // Conversion en Go (1 Go = 1024 * 1024 * 1024 octets)
        const totalGB = totalBytes / (1024 * 1024 * 1024);
        
        // Affichage des résultats
        document.getElementById('detailsText').innerText = mp3Count + " fichier(s) MP3 trouvé(s) !";
        document.getElementById('resultText').innerText = totalGB.toFixed(4) + " Go";
    });
</script>

</body>
</html>
